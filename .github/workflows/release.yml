name: Build Release

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/**'
      - '!.github/workflows/release.yml'

# Only one release build at a time; a newer push supersedes an in-flight one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # core/src/main/resources/languages and .../mappings are git submodules.
          # Without this the jar builds fine but has no locales or block mappings, and
          # Geyser dies at startup with "English locale not found in Geyser".
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Get previous build number
        id: getPreviousBuild
        run: |
          PREVIOUS_BUILD=$(git tag --list | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          echo result=${PREVIOUS_BUILD:-0} >> $GITHUB_OUTPUT

      - name: Get current build number
        id: getCurrentBuild
        env:
          PREVIOUS_BUILD: ${{ steps.getPreviousBuild.outputs.result }}
        run: echo result=$((PREVIOUS_BUILD + 1)) >> $GITHUB_OUTPUT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      # Only the Velocity bootstrap is built. This fork targets Velocity, so building
      # Spigot/Fabric/NeoForge/BungeeCord/Standalone/ViaProxy would just make every
      # release slower for artifacts nobody installs.
      - name: Build Geyser-Velocity
        run: ./gradlew :velocity:build
        env:
          BUILD_NUMBER: ${{ steps.getCurrentBuild.outputs.result }}

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: Geyser-Velocity
          path: bootstrap/velocity/build/libs/Geyser-Velocity.jar
          if-no-files-found: error

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        if: ${{ success() && github.ref_name == 'master' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: ''
          custom_tag: ${{ steps.getCurrentBuild.outputs.result }}

      - name: Generate release notes
        if: ${{ success() && github.ref_name == 'master' }}
        run: git fetch --tags --force && git log -n 50 --pretty=format:"* %s (%h)" > release_notes.md

      - name: Create release
        uses: ncipollo/release-action@v1
        if: ${{ success() && github.ref_name == 'master' }}
        with:
          artifacts: "bootstrap/velocity/build/libs/Geyser-Velocity.jar"
          allowUpdates: true
          bodyFile: "release_notes.md"
          draft: false
          prerelease: false
          name: Build ${{ steps.getCurrentBuild.outputs.result }} (${{ github.ref_name }})
          tag: ${{ steps.getCurrentBuild.outputs.result }}
          token: ${{ secrets.GITHUB_TOKEN }}
